{{ define "main" }}
  <div class="container">
    <div class="row">
      <!-- Remove or leave the left column empty -->
      <div class="col-md-1"></div>

      <!-- Expand the middle column to take up more space -->
      <div class="col-md-10">
        <div class="docContent">
          {{ .Content }}
        </div>
      </div>

      <!-- Right column for the table of contents -->
      <div class="col-md-1">
        {{ partial "toc.html" . }}
      </div>
    </div>
  </div>
{{ end }}
